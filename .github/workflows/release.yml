# 推送 v* tag 时构建安装版并发布到对应 Release。
# 每个平台一个构建 job（目前只有 Windows），产物经 artifact 汇总到 release job，统一生成 SHA256SUMS 并上传；
# 以后加 linux-x64 只需新增一个构建 job（pnpm package linux-x64）并加入 release 的 needs。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    env:
      INNO_VERSION: 6.7.3
      INNO_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
          cache: pnpm

      - name: 检查 tag 与 package.json 版本一致
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME 与 package.json 版本 $v 不一致" }

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: 安装 Inno Setup（固定版本并校验）
        run: |
          $exe = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-$($env:INNO_VERSION -replace '\.','_')/innosetup-$env:INNO_VERSION.exe" -OutFile $exe
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne $env:INNO_SHA256) { throw 'Inno Setup 安装程序 SHA256 不匹配' }
          $dir = "$env:RUNNER_TEMP\inno"
          $p = Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode) { throw "Inno Setup 安装失败：$($p.ExitCode)" }
          "ISCC=$dir\ISCC.exe" >> $env:GITHUB_ENV

      - run: pnpm package win-x64

      - name: 冒烟测试：静默安装、升级、卸载
        run: |
          $setup = (Get-Item build/out/*-setup.exe).FullName
          $app = "$env:ProgramFiles\tether-hub"
          $data = "$env:ProgramData\tether-hub"
          $base = 'http://127.0.0.1:8443'
          function Install($argv) {
            $p = Start-Process $setup -ArgumentList (@('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\setup.log") + $argv) -Wait -PassThru
            if ($p.ExitCode) { Get-Content "$env:RUNNER_TEMP\setup.log"; throw "安装失败：$($p.ExitCode)" }
          }
          function Check-Hub {
            for ($i = 0; $i -lt 60; $i++) {
              curl.exe -fsS -o NUL "$base/"
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep 1
            }
            if ($LASTEXITCODE) { Get-Content "$env:RUNNER_TEMP\setup.log"; Get-ChildItem "$data\logs" | Get-Content; throw 'hub 未启动' }
            Set-Content "$env:RUNNER_TEMP\login.json" '{"password":"smoke-pass"}'
            curl.exe -fsS -c "$env:RUNNER_TEMP\jar" -H 'Content-Type: application/json' --data-binary "@$env:RUNNER_TEMP\login.json" "$base/api/login"
            if ($LASTEXITCODE) { throw '登录失败' }
            curl.exe -fsS -b "$env:RUNNER_TEMP\jar" "$base/api/me"
            if ($LASTEXITCODE) { throw '登录后访问 /api/me 失败' }
          }

          Install @('/PASSWORD=smoke-pass', '/PORT=8443', '/INSECURE=1')
          Check-Hub
          sc.exe qc tether-hub
          & "$app\tether-hub-token.cmd" create smoke
          if ($LASTEXITCODE) { throw 'token 命令行失败' }
          Get-NetFirewallRule -DisplayName 'Tether Hub' -ErrorAction Stop | Format-Table DisplayName, Enabled, Direction, Action

          # 升级：不带参数重装，应保留配置（同一密码仍可登录）与数据
          Install @()
          Check-Hub
          & "$app\tether-hub-token.cmd" list
          if ($LASTEXITCODE) { throw 'token 命令行失败' }

          $p = Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode) { throw "卸载失败：$($p.ExitCode)" }
          for ($i = 0; $i -lt 30; $i++) { sc.exe query tether-hub | Out-Null; if ($LASTEXITCODE -eq 1060) { break }; Start-Sleep 1 }
          if ($LASTEXITCODE -ne 1060) { throw '卸载后服务仍存在' }
          if (Get-NetFirewallRule -DisplayName 'Tether Hub' -ErrorAction SilentlyContinue) { throw '卸载后防火墙规则仍存在' }
          if (-not (Test-Path "$data\config.env")) { throw '静默卸载不应删除配置' }
          $global:LASTEXITCODE = 0

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: win-x64
          path: |
            build/out/*.zip
            build/out/*-setup.exe
          if-no-files-found: error

  release:
    needs: [windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          path: assets
          merge-multiple: true

      - name: 生成 SHA256SUMS
        working-directory: assets
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: 上传到 Release（不存在则创建，说明取自 CHANGELOG）
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            awk -v h="## [${TAG#v}]" 'index($0, h) == 1 { f = 1; next } f && /^## \[/ { exit } f' CHANGELOG.md \
              | sed -e '/./,$!d' > notes.md
            if [ ! -s notes.md ]; then echo "CHANGELOG.md 中没有 ${TAG#v} 的版本段" >&2; exit 1; fi
            gh release create "$TAG" assets/* --title "$TAG" --notes-file notes.md --verify-tag
          fi
