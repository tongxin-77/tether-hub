# 推送 v* tag 时构建安装版并发布到对应 Release。
# 每个平台一个构建 job（目前只有 Windows），产物经 artifact 汇总到 release job，统一生成 SHA256SUMS 并上传；
# 以后加 linux-x64 只需新增一个构建 job（pnpm package linux-x64）并加入 release 的 needs。
name: release

on:
  push:
    tags: ['v*']
  # 手动运行（如在分支上验证打包与冒烟）：只跑构建 job，不发布
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      INNO_VERSION: 6.7.3
      INNO_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
          cache: pnpm

      - name: 检查 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME 与 package.json 版本 $v 不一致" }

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: 安装 Inno Setup（固定版本并校验）
        run: |
          $exe = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-$($env:INNO_VERSION -replace '\.','_')/innosetup-$env:INNO_VERSION.exe" -OutFile $exe
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne $env:INNO_SHA256) { throw 'Inno Setup 安装程序 SHA256 不匹配' }
          $dir = "$env:RUNNER_TEMP\inno"
          $p = Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$dir" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(300000)) { throw 'Inno Setup 安装超时' }
          if ($p.ExitCode) { throw "Inno Setup 安装失败：$($p.ExitCode)" }
          "ISCC=$dir\ISCC.exe" >> $env:GITHUB_ENV

      - run: pnpm package win-x64

      - name: 冒烟测试：静默安装、升级、卸载
        timeout-minutes: 15
        run: |
          $setup = (Get-Item build/out/*-setup.exe).FullName
          $app = "$env:ProgramFiles\tether-hub"
          $data = "$env:ProgramData\tether-hub"
          $base = 'http://127.0.0.1:8443'
          $log = "$env:RUNNER_TEMP\setup.log"
          function Dump {
            Write-Host '---- 进程 ----'
            Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'setup|unins|_iu|\.tmp|node|tether|winsw|cmd|net|sc|icacls' } |
              Format-Table ProcessId, ParentProcessId, Name, CommandLine -AutoSize -Wrap | Out-String -Width 300 | Write-Host
            Write-Host '---- sc query ----'; sc.exe query tether-hub | Write-Host
            if (Test-Path $log) { Write-Host '---- setup.log ----'; Get-Content $log | Write-Host }
            if (Test-Path "$data\logs") { Get-ChildItem "$data\logs" | ForEach-Object { Write-Host "---- $($_.Name) ----"; Get-Content $_.FullName | Write-Host } }
          }
          # 只等待进程本身（Start-Process -Wait 会等待整个进程树），超时打印诊断信息后失败
          function Run-Wait($file, $argv, $sec, $what) {
            $p = Start-Process $file -ArgumentList $argv -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit($sec * 1000)) { Dump; throw "$what 超时（$sec 秒）" }
            if ($p.ExitCode) { Dump; throw "$what 失败：退出码 $($p.ExitCode)" }
            Write-Host "$what 完成"
          }
          function Install($argv) {
            Run-Wait $setup (@('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$log") + $argv) 300 '安装'
          }
          function Token($argv) {
            $j = Start-Job { param($f, $a) & $f @a 2>&1; "exit=$LASTEXITCODE" } -ArgumentList "$app\tether-hub-token.cmd", $argv
            if (-not (Wait-Job $j -Timeout 60)) { Dump; throw "token 命令行超时：$argv" }
            $out = @(Receive-Job $j)
            $out | Write-Host
            if ($out[-1] -ne 'exit=0') { throw "token 命令行失败：$argv" }
          }
          function Check-Hub {
            for ($i = 0; $i -lt 60; $i++) {
              curl.exe -fsS -m 5 -o NUL "$base/"
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep 1
            }
            if ($LASTEXITCODE) { Dump; throw 'hub 未启动' }
            Write-Host '首页 200'
            Set-Content "$env:RUNNER_TEMP\login.json" '{"password":"smoke-pass"}'
            curl.exe -fsS -m 10 -c "$env:RUNNER_TEMP\jar" -H 'Content-Type: application/json' --data-binary "@$env:RUNNER_TEMP\login.json" "$base/api/login"
            if ($LASTEXITCODE) { throw '登录失败' }
            curl.exe -fsS -m 10 -b "$env:RUNNER_TEMP\jar" "$base/api/me"
            if ($LASTEXITCODE) { throw '登录后访问 /api/me 失败' }
            Write-Host ''
          }

          Install @('/PASSWORD=smoke-pass', '/PORT=8443', '/INSECURE=1')
          Check-Hub
          sc.exe qc tether-hub
          Token @('create', 'smoke')
          Get-NetFirewallRule -DisplayName 'Tether Hub' -ErrorAction Stop | Format-Table DisplayName, Enabled, Direction, Action

          # 升级：不带参数重装，应保留配置（同一密码仍可登录）与数据
          Install @()
          Check-Hub
          Token @('list')

          # unins000.exe 会把自己复制到临时目录再运行并立即退出，所以之后轮询结果
          Run-Wait "$app\unins000.exe" @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') 120 '启动卸载'
          for ($i = 0; $i -lt 120; $i++) {
            sc.exe query tether-hub | Out-Null
            if ($LASTEXITCODE -eq 1060 -and -not (Test-Path "$app\unins000.exe")) { break }
            Start-Sleep 1
          }
          if ($LASTEXITCODE -ne 1060) { Dump; throw '卸载后服务仍存在' }
          if (Test-Path "$app\unins000.exe") { Dump; throw '卸载超时' }
          if (Get-NetFirewallRule -DisplayName 'Tether Hub' -ErrorAction SilentlyContinue) { throw '卸载后防火墙规则仍存在' }
          if (-not (Test-Path "$data\config.env")) { throw '静默卸载不应删除配置' }
          Write-Host '卸载完成，配置保留'
          $global:LASTEXITCODE = 0

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: win-x64
          path: |
            build/out/*.zip
            build/out/*-setup.exe
          if-no-files-found: error

  release:
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          path: assets
          merge-multiple: true

      - name: 生成 SHA256SUMS
        working-directory: assets
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: 上传到 Release（不存在则创建，说明取自 CHANGELOG）
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            awk -v h="## [${TAG#v}]" 'index($0, h) == 1 { f = 1; next } f && /^## \[/ { exit } f' CHANGELOG.md \
              | sed -e '/./,$!d' > notes.md
            if [ ! -s notes.md ]; then echo "CHANGELOG.md 中没有 ${TAG#v} 的版本段" >&2; exit 1; fi
            gh release create "$TAG" assets/* --title "$TAG" --notes-file notes.md --verify-tag
          fi
