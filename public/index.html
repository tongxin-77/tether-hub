<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Tether Hub</title>
<link rel="stylesheet" href="/xterm/xterm.css">
<link rel="stylesheet" href="/style.css">
<script src="/xterm/xterm.js" defer></script>
<script src="/xterm/addon-fit.js" defer></script>
<script src="/locales.js" defer></script>
<script src="/i18n.js" defer></script>
<script src="/img.js" defer></script>
<script src="/textview.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body>
<div id="app">

  <!-- 登录 -->
  <section class="view" id="v-login">
    <div class="login">
      <form class="login-card" id="login-form">
        <div class="brand"><span class="brand-mark">T</span><span>Tether Hub</span></div>
        <h1 data-i18n="login.title">管理员登录</h1>
        <p class="sub" data-i18n="login.sub">汇总并远程接管各机器上的 Tether 终端会话</p>
        <label class="field"><span data-i18n="login.password">管理员密码</span>
          <input class="input" type="password" id="password" placeholder="请输入密码" data-i18n-ph="login.placeholder" autocomplete="current-password" required>
          <div class="err-tip" id="login-error" role="alert"></div>
        </label>
        <button class="btn btn-primary" type="submit" data-i18n="login.submit">登录</button>
        <div class="login-foot"><span data-i18n="login.foot">单用户自托管服务。密码由 hub 的 HUB_ADMIN_PASSWORD 设置。</span>
          <label class="lang-pick lang-inline"><i data-i="globe"></i><span class="lang-lbl"></span><select class="lang-sel" aria-label="语言" data-i18n-aria="lang.label"></select></label></div>
      </form>
    </div>
  </section>

  <!-- 主框架：机器与会话 + 审计 -->
  <section class="view" id="v-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">T</span><span class="txt">Tether Hub</span></div>
      <nav class="nav"><a href="#main" id="nav-main"><span data-i18n="nav.machines">机器</span><span class="only-d" data-i18n="nav.machines_more">与会话</span></a><a href="#audit" id="nav-audit"><span data-i18n="nav.audit">审计</span><span class="only-d" data-i18n="nav.audit_more">日志</span></a></nav>
      <div class="top-right">
        <button class="btn btn-ghost btn-sm upd-btn" id="upd-btn" title="版本与更新" aria-label="版本与更新" data-i18n-title="top.update" data-i18n-aria="top.update" hidden></button>
        <span class="sse" id="sse"></span>
        <button class="btn btn-ghost btn-sm tok-btn" id="tok-btn" title="管理机器 token" aria-label="管理机器 token" data-i18n-title="top.tokens" data-i18n-aria="top.tokens"><i data-i="key"></i><span class="only-d">Token</span></button>
        <label class="btn btn-ghost btn-sm lang-pick lang-btn only-d" title="语言" data-i18n-title="lang.label"><i data-i="globe"></i><span class="lbl lang-lbl"></span><select class="lang-sel" aria-label="语言" data-i18n-aria="lang.label"></select></label>
        <button class="btn btn-ghost btn-sm btn-icon" id="theme-btn" title="切换浅色 / 深色" aria-label="切换浅色 / 深色" data-i18n-title="top.theme" data-i18n-aria="top.theme"></button>
        <button class="btn btn-ghost btn-sm" id="logout" title="退出登录" data-i18n-title="top.logout_title"><i data-i="logout"></i><span class="only-d" data-i18n="top.logout">退出</span></button>
      </div>
    </header>
    <div class="alert-confirm" id="alert" hidden></div>

    <div class="page md" id="p-main">
      <aside class="master">
        <div class="master-head">
          <div class="master-title"><b data-i18n="machines.title">机器</b><span id="m-stat"></span></div>
          <div class="search"><i data-i="search"></i><input class="input" id="m-search" placeholder="搜索机器名称 / Token" data-i18n-ph="machines.search"></div>
        </div>
        <div class="mlist" id="m-list"></div>
      </aside>
      <main class="detail" id="detail"></main>
    </div>

    <div class="page audit" id="p-audit">
      <div class="card">
        <div class="card-head"><h3 data-i18n="audit.title">审计日志</h3><div class="extra"><span id="a-count"></span><button class="btn btn-sm" id="a-refresh"><i data-i="reset"></i><span data-i18n="common.refresh">刷新</span></button></div></div>
        <div class="filters">
          <label><span data-i18n="audit.f_event">事件</span><select class="select" id="f-ev"></select></label>
          <label><span data-i18n="audit.f_machine">机器</span><select class="select" id="f-m"></select></label>
          <label class="kw"><span data-i18n="audit.f_keyword">关键字</span><div class="search"><i data-i="search"></i><input class="input" id="f-kw" placeholder="会话名称 / 来源 IP" data-i18n-ph="audit.kw_ph"></div></label>
          <button class="btn reset" id="f-reset" data-i18n="common.reset">重置</button>
        </div>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th class="w-time" data-i18n="audit.th_time">时间</th><th class="w-ev" data-i18n="audit.th_event">事件</th><th data-i18n="audit.th_machine">机器</th><th data-i18n="audit.th_session">会话</th><th data-i18n="audit.th_ip">来源 IP</th><th data-i18n="audit.th_desc">说明</th></tr></thead><tbody id="a-body"></tbody></table></div>
        <div class="alist" id="a-list"></div>
        <div class="pager"><span id="a-total"></span><span id="a-pages"></span></div>
      </div>
    </div>
  </section>

  <!-- 接管终端 -->
  <section class="view term-view" id="v-term">
    <header class="term-head">
      <div class="term-title"><b id="t-name"></b><span id="t-sub"></span></div>
      <div class="right">
        <span id="t-tag"></span>
        <button class="btn btn-sm only-d" id="t-close" data-i18n="common.close">关闭</button>
        <button class="btn btn-sm tv-btn only-m" id="t-text" aria-label="以文本查看（可选择复制、长截图）" data-i18n-aria="term.text_aria" data-i18n="term.text">文本</button>
        <button class="btn close only-m" id="t-close-m" aria-label="关闭" data-i18n-aria="common.close"><i data-i="x"></i></button>
      </div>
    </header>
    <div class="term-body">
      <div id="t-banner"></div>
      <div class="term" id="term-wrap"><div class="term-box" id="term-box"></div><button class="to-bottom" id="t-bottom" data-i18n="term.to_bottom" hidden>↓ 回到底部</button><div class="t-toast" id="t-toast" role="status" hidden></div></div>
      <div class="term-foot only-d" id="t-foot"></div>
    </div>
    <div class="keys" id="keys">
      <button data-key="esc">Esc</button><button data-key="tab">Tab</button><button data-key="ctrl" aria-pressed="false">Ctrl</button><button data-key="up" aria-label="上" data-i18n-aria="keys.up">↑</button><button data-key="down" aria-label="下" data-i18n-aria="keys.down">↓</button><button data-key="left" aria-label="左" data-i18n-aria="keys.left">←</button><button data-key="right" aria-label="右" data-i18n-aria="keys.right">→</button><button data-key="paste" data-i18n="keys.paste">粘贴</button><button data-key="image" data-i18n="keys.image">图片</button>
      <input type="file" id="img-file" accept="image/*" multiple hidden>
    </div>
  </section>

  <!-- 版本与更新 -->
  <div class="modal" id="upd" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="upd-title">
      <div class="card-head"><h3 id="upd-title" data-i18n="upd.title">版本与更新</h3><label class="lang-pick lang-inline only-m"><i data-i="globe"></i><span class="lang-lbl"></span><select class="lang-sel" aria-label="语言" data-i18n-aria="lang.label"></select></label><button class="btn btn-ghost btn-icon modal-x" id="upd-close" aria-label="关闭" data-i18n-aria="common.close"><i data-i="x"></i></button></div>
      <div class="card-body" id="upd-body"></div>
    </div>
  </div>

  <!-- 机器 token -->
  <div class="modal" id="tok" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="tok-title">
      <div class="card-head"><h3 id="tok-title" data-i18n="tok.title">机器 Token</h3><button class="btn btn-ghost btn-icon modal-x" id="tok-close" aria-label="关闭" data-i18n-aria="common.close"><i data-i="x"></i></button></div>
      <div class="card-body">
        <form class="tok-form" id="tok-form">
          <input class="input" id="tok-name" placeholder="新 token 名称，如 my-pc" data-i18n-ph="tok.name_ph" maxlength="64" autocomplete="off" required>
          <button class="btn btn-primary" type="submit" data-i18n="tok.issue">签发</button>
        </form>
        <div class="err-tip" id="tok-err" role="alert"></div>
        <div id="tok-new"></div>
        <div class="upd-sec" data-i18n="tok.all">全部 token</div>
        <div class="tok-list" id="tok-list"></div>
      </div>
    </div>
  </div>

  <!-- 网页新建会话 -->
  <div class="modal" id="nc" hidden>
    <form class="modal-card" id="nc-form" role="dialog" aria-modal="true" aria-labelledby="nc-title">
      <div class="card-head"><h3 id="nc-title" data-i18n="nc.title">新建会话</h3><button class="btn btn-ghost btn-icon modal-x" type="button" id="nc-close" aria-label="关闭" data-i18n-aria="common.close"><i data-i="x"></i></button></div>
      <div class="card-body">
        <div class="nc-sub" id="nc-sub"></div>
        <div class="nc-seg" role="radiogroup" aria-label="会话类型" data-i18n-aria="nc.kind_aria">
          <label><input type="radio" name="nc-kind" value="local" checked><span data-i18n="nc.local">本地</span></label><label><input type="radio" name="nc-kind" value="remote">SSH</label>
        </div>
        <div id="nc-host-row" hidden>
          <div class="upd-sec" data-i18n="nc.host">SSH 主机</div>
          <select class="select" id="nc-host" aria-label="SSH 主机" data-i18n-aria="nc.host"></select>
        </div>
        <div class="upd-sec" data-i18n="nc.dir">目录</div>
        <div class="nc-dir">
          <input class="input mono" id="nc-cwd" maxlength="1024" autocomplete="off" spellcheck="false" aria-label="目录" data-i18n-aria="nc.dir">
          <select class="select" id="nc-recent" aria-label="最近目录" data-i18n-aria="nc.recent_aria"></select>
        </div>
        <div id="nc-resume-row">
          <label class="nc-chk"><input type="checkbox" id="nc-resume"><span data-i18n="nc.resume">恢复 Claude 对话</span></label>
          <div class="nc-hist" id="nc-hist" hidden></div>
        </div>
        <div class="err-tip" id="nc-err" role="alert"></div>
        <div class="upd-acts"><button class="btn" type="button" id="nc-cancel" data-i18n="common.cancel">取消</button><button class="btn btn-primary" type="submit" id="nc-ok" data-i18n="nc.create">新建</button></div>
      </div>
    </form>
  </div>

  <!-- 接管终端：无法读取剪贴板时手动粘贴 -->
  <div class="modal" id="paste" hidden>
    <form class="modal-card" id="paste-form" role="dialog" aria-modal="true" aria-labelledby="paste-title">
      <div class="card-head"><h3 id="paste-title" data-i18n="paste.title">粘贴到终端</h3><button class="btn btn-ghost btn-icon modal-x" type="button" id="paste-close" aria-label="关闭" data-i18n-aria="common.close"><i data-i="x"></i></button></div>
      <div class="card-body">
        <textarea class="input paste-ta" id="paste-text" placeholder="在此长按粘贴或输入文本" aria-label="要粘贴的文本" data-i18n-ph="paste.ph" data-i18n-aria="paste.aria"></textarea>
        <div class="tok-tip" data-i18n="paste.tip">当前无法直接读取剪贴板；https 下可一键粘贴。也可在此长按粘贴图片。</div>
        <div class="upd-acts"><button class="btn" type="button" id="paste-cancel" data-i18n="common.cancel">取消</button><button class="btn btn-primary" type="submit" data-i18n="paste.send">发送</button></div>
      </div>
    </form>
  </div>
</div>

<!-- 接管终端：文本视图（手机），打开时隐藏 #app，由文档本身滚动以便长按选择与系统长截图 -->
<div class="tv" id="tv">
  <div class="tv-bar"><b data-i18n="tv.title">文本视图</b><span class="tv-tip" id="tv-tip" role="status"></span><button class="btn btn-sm" id="tv-copy" data-i18n="tv.copy_all">复制全部</button><button class="btn btn-sm" id="tv-close" data-i18n="common.close">关闭</button></div>
  <pre class="tv-pre" id="tv-pre"></pre>
</div>
</body>
</html>
