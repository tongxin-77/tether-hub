<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tether Hub</title>
<link rel="stylesheet" href="/xterm/xterm.css">
<link rel="stylesheet" href="/style.css">
<script src="/xterm/xterm.js" defer></script>
<script src="/xterm/addon-fit.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body>
<section id="login" class="login" hidden>
  <form id="login-form" class="card login-card">
    <div class="brand"><span class="logo">T</span>Tether Hub</div>
    <label for="password">管理员密码</label>
    <input id="password" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">登录</button>
    <p id="login-error" class="error" role="alert"></p>
  </form>
</section>

<section id="main" hidden>
  <header class="top">
    <div class="brand"><span class="logo">T</span>Tether Hub</div>
    <div id="summary" class="summary"></div>
    <span id="conn" class="conn" title="实时连接状态"></span>
    <button id="logout" class="ghost">退出登录</button>
  </header>
  <main id="machines" class="machines"></main>
  <section class="audit-wrap">
    <div class="audit-head">
      <h2>接管审计</h2>
      <button id="audit-refresh" class="ghost">刷新</button>
    </div>
    <div class="card audit"><table><tbody id="audit"></tbody></table></div>
  </section>
</section>

<section id="term" class="term-overlay" hidden>
  <div class="card term-card">
    <header class="term-head">
      <span id="term-title" class="term-title"></span>
      <span id="term-status" class="term-status"></span>
      <button id="term-close" class="ghost">关闭</button>
    </header>
    <div id="term-box" class="term-box"></div>
  </div>
</section>
</body>
</html>
