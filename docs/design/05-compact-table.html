<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Tether Hub · 紧凑表格</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#fff; --surface-2:#f7f8fa; --hover:#f3f5f8; --track:#eef0f3;
  --border:#e6e8eb; --border-strong:#d5d9de;
  --text:#1d2129; --text-2:#4e5969; --text-3:#86909c; --text-4:#c2c7cf;
  --primary:#2f54eb; --primary-hover:#4669f0; --primary-soft:#eef2fe; --primary-line:#c9d4fb;
  --success:#1f9d55; --success-soft:#ebf8f0; --success-line:#bfe8cf;
  --warn:#f07c0c; --warn-strong:#c05a06; --warn-soft:#fff5e9; --warn-line:#fbd5a5; --warn-row:#fffaf3;
  --error:#e5484d; --error-soft:#fef0f0; --error-line:#f9c9ca;
  --purple:#7246d8; --purple-soft:#f4effd; --purple-line:#dacdf7;
  --shadow-sm:none;
  --shadow:0 1px 3px rgba(16,24,40,.035),0 4px 16px rgba(16,24,40,.035);
  --shadow-lg:0 12px 36px rgba(16,24,40,.10);
  --focus:0 0 0 3px rgba(47,84,235,.16);
  --overlay:rgba(15,18,24,.42);
  --r-sm:8px; --r:10px; --r-lg:14px; --app-h:100dvh;
  --mono:Consolas,"Cascadia Mono","SFMono-Regular",Menlo,monospace;
  --term-bg:#0f1115; --term-bar:#16191e; --term-line:#262a31;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d0e10; --surface:#151719; --surface-2:#1a1c20; --hover:#1e2125; --track:#222529;
    --border:#272a2f; --border-strong:#363a41;
    --text:#e7e9ec; --text-2:#b3b9c2; --text-3:#7f8792; --text-4:#4a5059;
    --primary:#6283ff; --primary-hover:#7b97ff; --primary-soft:rgba(98,131,255,.13); --primary-line:rgba(98,131,255,.38);
    --success:#40c977; --success-soft:rgba(64,201,119,.12); --success-line:rgba(64,201,119,.32);
    --warn:#f59e0b; --warn-strong:#fbbf4a; --warn-soft:rgba(245,158,11,.12); --warn-line:rgba(245,158,11,.38); --warn-row:rgba(245,158,11,.055);
    --error:#f26b6f; --error-soft:rgba(242,107,111,.12); --error-line:rgba(242,107,111,.34);
    --purple:#a689f5; --purple-soft:rgba(166,137,245,.13); --purple-line:rgba(166,137,245,.36);
    --shadow-sm:none; --shadow:0 1px 2px rgba(0,0,0,.3);
    --shadow-lg:0 16px 40px rgba(0,0,0,.5); --focus:0 0 0 3px rgba(98,131,255,.25);
    --overlay:rgba(0,0,0,.6); --term-bg:#0b0c0e; --term-bar:#121417; --term-line:#24272c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d0e10; --surface:#151719; --surface-2:#1a1c20; --hover:#1e2125; --track:#222529;
  --border:#272a2f; --border-strong:#363a41;
  --text:#e7e9ec; --text-2:#b3b9c2; --text-3:#7f8792; --text-4:#4a5059;
  --primary:#6283ff; --primary-hover:#7b97ff; --primary-soft:rgba(98,131,255,.13); --primary-line:rgba(98,131,255,.38);
  --success:#40c977; --success-soft:rgba(64,201,119,.12); --success-line:rgba(64,201,119,.32);
  --warn:#f59e0b; --warn-strong:#fbbf4a; --warn-soft:rgba(245,158,11,.12); --warn-line:rgba(245,158,11,.38); --warn-row:rgba(245,158,11,.055);
  --error:#f26b6f; --error-soft:rgba(242,107,111,.12); --error-line:rgba(242,107,111,.34);
  --purple:#a689f5; --purple-soft:rgba(166,137,245,.13); --purple-line:rgba(166,137,245,.36);
  --shadow-sm:none; --shadow:0 1px 2px rgba(0,0,0,.3);
  --shadow-lg:0 16px 40px rgba(0,0,0,.5); --focus:0 0 0 3px rgba(98,131,255,.25);
  --overlay:rgba(0,0,0,.6); --term-bg:#0b0c0e; --term-bar:#121417; --term-line:#24272c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:13px;line-height:1.55;color:var(--text);background:var(--bg);
  font-variant-numeric:tabular-nums;
  display:flex;flex-direction:column;height:var(--app-h);overflow:hidden;
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:var(--mono);font-size:.96em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-3)}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[hidden]{display:none!important}
svg.i{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}

/* ---------- 原型切换器 ---------- */
#proto{
  position:fixed;right:12px;bottom:12px;z-index:100;display:flex;align-items:center;gap:2px;
  background:var(--surface);border:1px dashed var(--border-strong);border-radius:var(--r);padding:3px;box-shadow:var(--shadow-lg);
}
#proto .lbl{color:var(--text-3);padding:0 6px 0 5px}
#proto a{padding:2px 9px;border-radius:var(--r-sm);color:var(--text-2);text-decoration:none}
#proto a:hover{background:var(--hover)}
#proto a.on{background:var(--primary);color:#fff}
@media (min-width:768px){
body.in-term #proto{bottom:0;right:0;border-radius:var(--r) 0 0 0;box-shadow:none;border-style:dashed none none dashed;padding:0 3px;height:26px;background:var(--term-bar);border-color:#3a3f47}
body.in-term #proto .lbl{color:#6b7280}
body.in-term #proto a{padding:0 8px;color:#a3a9b3;line-height:20px}
body.in-term #proto a:hover{background:#22262c}
body.in-term #proto a.on{color:#fff;background:#2f3a5c}
body.in-term .term-bar{padding-right:300px}
}

/* ---------- 通用组件 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:28px;padding:0 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:var(--hover);border-color:var(--border-strong)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:none}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.soft{background:var(--primary-soft);border-color:transparent;color:var(--primary);box-shadow:none;font-weight:500}
.btn.soft:hover{border-color:var(--primary-line)}
.btn.ghost{border-color:transparent;background:none;box-shadow:none;color:var(--text-2)}
.btn.ghost:hover{background:var(--hover);color:var(--text)}
.btn.link{border-color:transparent;background:none;box-shadow:none;color:var(--primary);padding:0 4px}
.btn.link:hover{color:var(--primary-hover);background:var(--primary-soft)}
.btn[disabled]{color:var(--text-4);background:transparent;border-color:transparent;box-shadow:none;cursor:not-allowed}
.input,.select{height:28px;border:1px solid transparent;border-radius:var(--r-sm);background:var(--track);padding:0 10px;outline:none;transition:border-color .15s,box-shadow .15s}
.input:hover,.select:hover{background:var(--hover);border-color:var(--border)}
.input:focus,.select:focus{background:var(--surface);border-color:var(--primary);box-shadow:var(--focus)}
.input::placeholder{color:var(--text-3)}
.select{padding-right:4px}
.search-box{position:relative;display:inline-flex;align-items:center}
.search-box svg{position:absolute;left:8px;color:var(--text-3);pointer-events:none}
.search-box .input{padding-left:28px;width:100%}

.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border:0;border-radius:999px;background:var(--track);color:var(--text-2);font-size:12px;line-height:18px;white-space:nowrap}
.tag.blue{color:var(--primary);background:var(--primary-soft)}
.tag.orange{color:var(--warn-strong);background:var(--warn-soft)}
.tag.orange-solid{color:#fff;background:var(--warn);font-weight:500}
.tag .k{font-family:var(--mono);font-size:11px;opacity:.7}
.badge{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text-4);flex:none}
.dot.on{background:var(--primary)} .dot.warn{background:var(--warn)} .dot.grey{background:var(--text-4)} .dot.ring{background:none;box-shadow:inset 0 0 0 1.5px var(--text-3)}
.dot.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.spin{width:9px;height:9px;border:1.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

.switch{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;white-space:nowrap}
.switch i{position:relative;width:28px;height:16px;border-radius:8px;background:var(--border-strong);transition:background .2s;flex:none}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .2s}
.switch input{display:none}
.switch input:checked+i{background:var(--primary)}
.switch input:checked+i::after{left:14px}

.chk{display:inline-flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap;user-select:none;color:var(--text-2)}
.chk input{accent-color:var(--primary);margin:0;width:13px;height:13px}

.views{flex:1;min-height:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:none;flex-direction:column}
.view.on{display:flex}

/* ---------- 登录 ---------- */
#v-login{align-items:center;justify-content:center;padding:16px;overflow:auto;position:relative}
#v-login .theme-btn{position:absolute;top:12px;right:12px}
.login-card{width:360px;max-width:100%;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:32px 28px 24px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px;letter-spacing:-.01em}
.brand .logo{width:24px;height:24px;border-radius:7px;background:var(--primary);color:#fff;display:grid;place-items:center}
.brand .logo svg{width:14px;height:14px;stroke-width:2}
.login-card .brand{font-size:18px;justify-content:center;margin-bottom:4px}
.login-card .brand .logo{width:30px;height:30px;border-radius:8px}
.login-card .brand .logo svg{width:17px;height:17px}
.login-card .sub{text-align:center;color:var(--text-3);margin-bottom:24px}
.form-item{margin-bottom:16px}
.form-item label{display:block;margin-bottom:6px;color:var(--text);font-weight:500}
.form-item .input{width:100%;height:36px;font-size:14px}
.form-item .err{color:var(--error);margin-top:4px}
.login-card .btn.primary{width:100%;height:36px;font-size:14px;font-weight:500}
.login-foot{margin-top:16px;color:var(--text-3);text-align:center;display:flex;align-items:center;justify-content:center;gap:5px}

/* ---------- 顶栏 ---------- */
.topbar{height:52px;flex:none;background:var(--bg);display:flex;align-items:center;gap:16px;padding:0 20px}
.topbar .grow{flex:1}
.topbar .vsep{width:1px;height:16px;background:var(--border)}
.sse{display:inline-flex;align-items:center;gap:7px;color:var(--text-2);cursor:pointer;height:28px;padding:0 12px;border-radius:999px;background:var(--surface)}
.sse:hover{background:var(--hover)}
.topbar .stat{color:var(--text-3);display:flex;gap:14px}
.topbar .stat b{color:var(--text);font-weight:600}
.topbar .stat .w b{color:var(--warn-strong)}
.topbar .stat .w{color:var(--warn-strong)}
.icon-btn{width:28px;height:28px;border:0;background:none;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--text-2);flex:none}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn svg.i{width:16px;height:16px}

/* ---------- 主界面 ---------- */
#v-main .scroll{flex:1;min-height:0;overflow:auto}
.alert{display:flex;align-items:center;gap:10px;margin:4px 20px 0;padding:8px 8px 8px 16px;background:var(--warn-soft);border-radius:var(--r-lg)}
.alert .ico{color:var(--warn);display:grid;place-items:center;flex:none}
.alert .ico svg{width:16px;height:16px}
.alert .items{flex:1;min-width:0;display:flex;align-items:center;gap:6px 4px;flex-wrap:wrap}
.alert .items a{color:var(--warn-strong);text-decoration:none;white-space:nowrap;display:inline-block}
.alert .items a:hover{text-decoration:underline}
.alert .items a b{font-weight:600}
.alert .sep{color:var(--text-3)}
.panel{margin:12px 20px 64px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;padding:0 8px 4px}
.panel-head{display:flex;align-items:center;gap:14px;padding:12px 6px 10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--track);padding:2px;border-radius:var(--r)}
.seg button{border:0;background:none;padding:0 14px;height:26px;border-radius:var(--r-sm);color:var(--text-2);display:inline-flex;align-items:center;gap:5px}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(16,24,40,.08);font-weight:500}
.seg button .n{color:var(--text-3);font-weight:400;font-size:12px}
.filters{display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex:1}
.filters .grp{display:inline-flex;align-items:center;gap:8px}
.filters .grp>span:first-child{color:var(--text-3)}
.filters .search-box{margin-left:auto;width:240px}
@media (min-width:768px){.mob-only{display:none!important}}

table.tbl{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.tbl th,.tbl td{padding:6px 10px;text-align:left;vertical-align:middle}
.tbl td:first-child,.tbl th:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm)}
.tbl td:last-child,.tbl th:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0}
.tbl th{background:var(--surface-2);font-weight:500;color:var(--text-3);font-size:12px;padding-top:7px;padding-bottom:7px;position:sticky;top:0;z-index:1;white-space:nowrap}
.tbl tbody tr.row td{height:36px}
.tbl tbody tr.row:hover td{background:var(--hover)}
.tbl tr.row.confirm td{background:var(--warn-row)}
.tbl tr.row.confirm:hover td{background:var(--warn-soft)}
.tbl tr.row.confirm td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.tbl tr.row.has-detail td:first-child{border-bottom-left-radius:0}
.tbl tr.row.has-detail td:last-child{border-bottom-right-radius:0}
.tbl tr.row.has-detail td{background:var(--surface-2)}
.tbl tr.row.confirm.has-detail td{background:var(--warn-row)}
tr.detail td{border-radius:0 0 var(--r-sm) var(--r-sm)!important}
.tbl tr.row.exited td{color:var(--text-3)}
.tbl tr.row.offline td.mcell{color:var(--text-3)}
.tbl td.exp{padding:0;text-align:center}
.exp-btn{width:20px;height:20px;border:0;border-radius:var(--r-sm);background:none;padding:0;display:inline-grid;place-items:center;color:var(--text-3)}
.exp-btn:hover{background:var(--track);color:var(--text)}
.exp-btn svg{transition:transform .15s}
.exp-btn.open svg{transform:rotate(90deg)}
tr.detail td{background:var(--surface-2);padding:10px 12px 12px 42px}
tr.detail.confirm td{background:var(--warn-row)}
tr.detail.confirm td:first-child{box-shadow:inset 3px 0 0 var(--warn);border-top-left-radius:0}
.desc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 24px;margin:0}
.desc div{display:flex;gap:10px;min-width:0}
.desc dt{color:var(--text-3);flex:none}
.desc dd{margin:0;min-width:0;word-break:break-all}
.tbl .sname{font-weight:500}
.tbl .sid{color:var(--text-3);margin-left:5px;font-weight:400;font-size:12px}
.tbl .take{height:26px;padding:0 12px}
.tbl .empty td{text-align:center;color:var(--text-3);padding:36px}
.tfoot{display:flex;align-items:center;justify-content:space-between;padding:8px 6px 6px;color:var(--text-3)}
.pager{display:flex;gap:4px;align-items:center}
.pager .pg{min-width:26px;height:26px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--text-2)}
.pager .pg.on{background:var(--primary-soft);color:var(--primary);font-weight:500}
.cards{display:none}

/* ---------- 终端 ---------- */
#v-term{background:var(--term-bg)}
.term-head{flex:none;height:52px;display:flex;align-items:center;gap:10px;padding:0 12px 0 20px;background:var(--surface)}
.term-head .ttl{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.term-head .ttl b{font-weight:600;font-size:13px;white-space:nowrap}
.term-head .ttl .cwd{color:var(--text-3);min-width:0}
.term-head .demo{display:flex;align-items:center;gap:6px;color:var(--text-3)}
.term-wrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;padding:10px 4px 10px 14px}
.term{flex:1;min-height:0;overflow:auto;font-family:var(--mono);font-size:13px;line-height:18px;color:#d6d9de;white-space:pre;scrollbar-color:#3a3f47 transparent}
.term .l{min-height:18px}
.term:focus{outline:none}
.tbox{display:inline-block;border:1px solid #e88a3a;border-radius:10px;padding:3px 12px;margin:3px 0 3px 2px}
.c-dim{color:#7d8590}.c-grn{color:#5fd38d}.c-red{color:#ff7b7f}.c-yel{color:#f5d76e}.c-blu{color:#7aa2ff}.c-mag{color:#c4a7ff}.c-cyn{color:#5ed4cc}.c-org{color:#f0a05a}.c-wht{color:#fff}
.b{font-weight:700}
.cursor{display:inline-block;width:8px;height:15px;background:#d6d9de;vertical-align:-3px;animation:blink 1.1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.term-bar{flex:none;height:26px;display:flex;align-items:center;gap:16px;padding:0 14px;background:var(--term-bar);border-top:1px solid var(--term-line);color:#8b929c;font-size:12px}
.term-bar .grow{flex:1}
.term-bar .badge{color:#c9ced6}
.term-mask{position:absolute;inset:0;background:rgba(8,9,11,.66);display:grid;place-items:center;padding:16px}
.mask-card{width:380px;max-width:100%;background:var(--surface);border-radius:16px;padding:22px 22px 18px;box-shadow:var(--shadow-lg)}
.mask-card h3{margin:0 0 8px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.mask-card h3 .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--track);color:var(--text-2)}
.mask-card h3 .ic.orange{background:var(--warn-soft);color:var(--warn)}
.mask-card h3 .ic.red{background:var(--error-soft);color:var(--error)}
.mask-card h3 .ic svg{width:16px;height:16px}
.mask-card p{margin:0 0 16px;color:var(--text-2)}
.mask-card .acts{display:flex;justify-content:flex-end;gap:8px}
.keybar{display:none}
#kbd{position:absolute;opacity:0;width:1px;height:1px;left:-10px;bottom:0}

/* ---------- 底部弹出面板（手机筛选） ---------- */
.sheet-mask{position:fixed;inset:0;background:var(--overlay);z-index:200;display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));max-height:85%;overflow:auto;box-shadow:var(--shadow-lg)}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--border-strong);margin:0 auto 8px}
.sheet h4{margin:0;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:space-between;height:44px}
.sheet h4 .icon-btn{width:44px;height:44px;margin-right:-10px}
.sheet .sec{padding:10px 0}
.sheet .sec>.t{color:var(--text-3);margin-bottom:8px;font-size:13px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:40px;padding:0 16px;border:1px solid transparent;border-radius:var(--r);background:var(--track);font-size:14px;color:var(--text-2)}
.opt.on{color:var(--primary);background:var(--primary-soft);font-weight:500}
.sheet .row-sw{display:flex;align-items:center;justify-content:space-between;min-height:44px;font-size:14px}
.sheet .acts{display:flex;gap:8px;padding-top:12px}
.sheet .acts .btn{flex:1;height:44px;font-size:15px;border-radius:var(--r)}

/* =================== 手机 =================== */
@media (max-width:767px){
  body{font-size:14px}
  .form-item .input,.login-card .btn.primary{height:44px;font-size:16px;border-radius:var(--r)}
  #proto{position:static;order:-1;flex:none;justify-content:center;border-radius:0;border-width:0 0 1px;box-shadow:none;background:var(--surface-2);padding:4px 8px;gap:4px}
  #proto .lbl{font-size:12px}
  #proto a{padding:6px 10px;font-size:13px;border-radius:var(--r)}
  .desk-only{display:none!important}
  .topbar{height:56px;padding:0 6px 0 14px;gap:2px}

$('#sheet').addEventListener('click',e=>{
  const sh=$('#sheet'), t=e.target.closest('button,input');
  if(e.target===sh||(t&&t.hasAttribute('data-close'))){sh.hidden=true;return}
  if(!t)return;
  if(t.hasAttribute('data-reset')){
    if(sh.dataset.kind==='audit'){A.event='';A.machine=''}else{F.machine='';F.confirm=false;F.status=new Set(Object.keys(ST))}
  }
  else if(t.dataset.m!==undefined)F.machine=t.dataset.m;
  else if(t.dataset.st){F.status.has(t.dataset.st)?F.status.delete(t.dataset.st):F.status.add(t.dataset.st)}
  else if(t.id==='shConfirm')F.confirm=t.checked;
  else if(t.dataset.ae!==undefined)A.event=t.dataset.ae;
  else if(t.dataset.am!==undefined)A.machine=t.dataset.am;
  else return;
  syncFilterUI(); $('#aEvent').value=A.event; $('#aMachine').value=A.machine;
  render(); openSheet(sh.dataset.kind);
});

/* ---------------- 路由 ---------------- */
function route(){
  const raw=(location.hash||'#main').slice(1), [v,arg]=raw.split(':');
  const view=v==='login'?'login':v==='term'?'term':'main';
  $$('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+view));
  document.body.classList.toggle('in-term',view==='term');
  $$('#proto a').forEach(a=>a.classList.toggle('on',a.dataset.v===(v==='machines'?'main':v||'main')));
  $('#sheet').hidden=true;
  if(view==='main'){tab=v==='audit'?'audit':v==='machines'?'machines':'sessions';render();$('#mainScroll').scrollTop=0}
  if(view==='term')renderTerm(TS[arg]?arg:'');
  paintIcons();
  fitVV();
}
addEventListener('hashchange',route);
syncFilterUI(); route(); paintIcons();
</script>
</body>
</html>
