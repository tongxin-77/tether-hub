<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tether Hub 奶油</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* 01 奶油：与 Tether 客户端「奶油」主题同源——燕麦画布上的奶白软垫，焦糖主色，蜂蜜色专门留给“等待确认” */
:root {
  --canvas: #efe6d8; --cream: #fbf6ee; --pad: #f4ecdf; --pad-2: #ece1d0; --line: #e2d4bf;
  --ink: #4a3a2e; --ink-2: #7d6a5a; --ink-3: #a08b75;
  --caramel: #c68a4e; --caramel-deep: #a86f37; --caramel-soft: #f3dfc6;
  --sage: #7f9568; --sage-soft: #e3e9d5;
  --honey: #d9a441; --honey-soft: #f6e6c1; --honey-ink: #8a5f12;
  --rose: #c06e5e; --rose-soft: #f3d9d1;
  --plum: #8d6d90; --plum-soft: #ebdeea;
  --t-bg: #2f241d; --t-fg: #efe2cf; --t-dim: #9c8670; --t-acc: #e3a867; --t-ok: #b4c58f; --t-warn: #f0c66b; --t-err: #e59a86; --t-blue: #a9c2c9;
  --shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 10px 30px -12px rgba(120,84,48,.25), 0 2px 6px -2px rgba(120,84,48,.12);
  --f-ui: "Nunito", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", "Cascadia Mono", Consolas, "Microsoft YaHei Mono", monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  min-height: 100vh; background: var(--canvas); color: var(--ink); font: 14px/1.55 var(--f-ui);
  background-image: radial-gradient(circle at 12% 0%, rgba(255,255,255,.5), transparent 40%), radial-gradient(circle at 90% 100%, rgba(198,138,78,.10), transparent 45%);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
:focus-visible { outline: 2px solid var(--caramel); outline-offset: 2px; }
.btn { border-radius: 999px; padding: 8px 18px; font-weight: 800; background: var(--caramel); color: #fff; white-space: nowrap; }
.btn:hover { background: var(--caramel-deep); }
.btn.ghost { background: transparent; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
.btn.ghost:hover { background: var(--pad-2); }
.btn.sm { padding: 5px 14px; font-size: 13px; }
.logo { width: 32px; height: 32px; border-radius: 11px; display: grid; place-items: center; background: var(--caramel); color: #fff; font-weight: 900; box-shadow: 0 4px 10px -4px rgba(168,111,55,.6); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 17px; }

/* 原型页签：仅原型用 */
.proto { position: fixed; right: 16px; bottom: 16px; z-index: 50; display: flex; gap: 4px; padding: 4px; background: var(--ink); border-radius: 999px; box-shadow: var(--shadow); }
.proto button { color: #e9dccb; font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 999px; }
.proto button[aria-current="page"] { background: var(--caramel); color: #fff; }

/* ===== 登录 ===== */
.login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.login-card { width: min(380px, 100%); background: var(--cream); border-radius: 26px; box-shadow: var(--shadow), 0 0 0 1px var(--line); padding: 36px 32px 28px; display: flex; flex-direction: column; gap: 14px; }
.login-card h1 { margin: 10px 0 0; font-size: 22px; font-weight: 900; }
.login-card p { margin: 0 0 6px; color: var(--ink-2); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 700; color: var(--ink-2); }
input { font: inherit; color: var(--ink); background: var(--pad); border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px; outline: none; }
input:focus { border-color: var(--caramel); box-shadow: 0 0 0 4px var(--caramel-soft); }
.login-card .btn { padding: 11px; margin-top: 4px; }
.login-foot { font-size: 12px; color: var(--ink-3); text-align: center; margin-top: 4px; }

/* ===== 主框架 ===== */
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 20px; padding: 14px 28px; background: color-mix(in srgb, var(--canvas) 86%, transparent); backdrop-filter: blur(10px); }
.tabs { display: flex; gap: 4px; background: var(--pad-2); padding: 4px; border-radius: 999px; }
.tabs button { padding: 5px 16px; border-radius: 999px; font-weight: 700; color: var(--ink-2); }
.tabs button[aria-current="page"] { background: var(--cream); color: var(--ink); box-shadow: 0 2px 6px -2px rgba(120,84,48,.3); }
.top .grow { flex: 1; }
.live { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--sage); background: var(--sage-soft); padding: 5px 12px 5px 10px; border-radius: 999px; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 0 currentColor; animation: ping 2.4s ease-out infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(127,149,104,.5); } 70%, 100% { box-shadow: 0 0 0 7px rgba(127,149,104,0); } }

.wrap { max-width: 1240px; margin: 0 auto; padding: 8px 28px 64px; }

/* 等待确认：整页唯一的暖黄色块 */
.attn { background: linear-gradient(180deg, #f9eccb, var(--honey-soft)); border-radius: 26px; padding: 20px 22px; box-shadow: 0 0 0 1px #e9c97d, 0 14px 30px -16px rgba(217,164,65,.7); margin-bottom: 26px; }
.attn-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; color: var(--honey-ink); }
.attn-head h2 { margin: 0; font-size: 18px; font-weight: 900; }
.attn-item { display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 14px; align-items: center; background: rgba(255,252,244,.75); border-radius: 18px; padding: 12px 14px; }
.attn-item + .attn-item { margin-top: 8px; }
.bell { width: 44px; height: 44px; border-radius: 14px; background: var(--honey); color: #fff; display: grid; place-items: center; animation: nudge 2.6s ease-in-out infinite; }
.bell svg { width: 22px; height: 22px; }
@keyframes nudge { 0%, 80%, 100% { transform: rotate(0); } 84% { transform: rotate(-10deg); } 90% { transform: rotate(8deg); } 95% { transform: rotate(-4deg); } }
.attn-title { font-weight: 900; font-size: 16px; }
.attn-title small { font-weight: 700; color: var(--ink-3); font-size: 13px; margin-left: 6px; }
.attn-ask { color: var(--honey-ink); font-weight: 700; overflow-wrap: anywhere; }
.attn .btn { background: var(--honey-ink); padding: 10px 22px; }
.attn .btn:hover { background: #6e4b0c; }

.layout { display: grid; grid-template-columns: 260px minmax(0,1fr); gap: 24px; align-items: start; }
.rail { position: sticky; top: 78px; display: flex; flex-direction: column; gap: 10px; }
.rail h3, .sec-h { margin: 0 0 2px 6px; font-size: 13px; font-weight: 800; color: var(--ink-3); }
.mcard { background: var(--cream); border-radius: 20px; padding: 14px 16px; box-shadow: var(--shadow), 0 0 0 1px var(--line); display: grid; grid-template-columns: auto minmax(0,1fr); gap: 2px 10px; text-decoration: none; color: inherit; }
.mcard.off { background: var(--pad); box-shadow: 0 0 0 1px var(--line); }
.mcard .dot { grid-row: span 3; margin-top: 7px; }
.mcard b { font-size: 15px; font-weight: 900; }
.mcard span { font-size: 12px; color: var(--ink-3); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--sage); box-shadow: 0 0 0 3px var(--sage-soft); }
.off .dot, .dot.off { background: var(--ink-3); box-shadow: 0 0 0 3px var(--pad-2); }

.group { margin-bottom: 26px; }
.g-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 6px 10px; }
.g-head h2 { margin: 0; font-size: 18px; font-weight: 900; }
.g-meta { color: var(--ink-3); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 14px; margin-left: auto; }
.pill { border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 800; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.pill.on { background: var(--sage-soft); color: var(--sage); }
.pill.off { background: var(--pad-2); color: var(--ink-2); }
.list { background: var(--cream); border-radius: 22px; box-shadow: var(--shadow), 0 0 0 1px var(--line); padding: 6px; }
.row { display: grid; grid-template-columns: minmax(0,1.5fr) minmax(0,1fr) auto; gap: 6px 18px; align-items: center; padding: 12px 14px; border-radius: 16px; }
.row + .row { box-shadow: 0 -1px 0 var(--pad-2); }
.row:hover { background: var(--pad); }
.row.waiting { background: var(--honey-soft); box-shadow: inset 0 0 0 1.5px var(--honey); }
.row.s-exited { opacity: .62; }
.r-name { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 800; font-size: 15px; }
.r-name span.n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-path { font: 12px/1.5 var(--f-mono); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-path em { font-style: normal; color: var(--ink-3); }
.r-mid { display: flex; flex-direction: column; gap: 4px; min-width: 0; font-size: 12px; color: var(--ink-3); }
.r-mid .pills { display: flex; gap: 6px; flex-wrap: wrap; }
.r-act { justify-self: end; }
.empty { padding: 26px 18px; color: var(--ink-3); text-align: center; }
.st-running { background: var(--sage-soft); color: var(--sage); }
.st-waiting { background: var(--caramel-soft); color: var(--caramel-deep); }
.st-exited { background: var(--pad-2); color: var(--ink-2); }
.cl::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.cl-thinking { background: var(--caramel-soft); color: var(--caramel-deep); }
.cl-thinking::before { animation: breathe 1.4s ease-in-out infinite; }
.cl-waiting { background: var(--honey); color: #fff; }
.cl-background { background: var(--plum-soft); color: var(--plum); }
.cl-done { background: var(--sage-soft); color: var(--sage); }
.host { background: #e6edf0; color: #577482; }
@keyframes breathe { 50% { opacity: .25; } }

/* ===== 接管终端 ===== */
.term-page { height: 100vh; display: flex; flex-direction: column; padding: 18px 24px 24px; gap: 14px; }
.term-card { flex: 1; min-height: 0; background: var(--cream); border-radius: 26px; box-shadow: var(--shadow), 0 0 0 1px var(--line); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.t-head { display: flex; align-items: center; gap: 12px; padding: 2px 4px 0; flex-wrap: wrap; }
.t-title { font-weight: 900; font-size: 16px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-title small { color: var(--ink-3); font-weight: 700; margin-left: 6px; }
.t-state { display: inline-flex; align-items: center; gap: 7px; }
body[data-tstate="active"] .t-state { background: var(--sage-soft); color: var(--sage); }
body[data-tstate="reclaimed"] .t-state, body[data-tstate="disabled"] .t-state { background: var(--honey-soft); color: var(--honey-ink); }
body[data-tstate="exited"] .t-state, body[data-tstate="offline"] .t-state { background: var(--rose-soft); color: var(--rose); }
.t-head .grow { flex: 1; }
.switch { display: flex; gap: 4px; flex-wrap: wrap; font-size: 12px; }
.switch button { padding: 3px 10px; border-radius: 999px; color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line); font-weight: 700; }
.switch button[aria-pressed="true"] { color: var(--ink); background: var(--pad-2); }
.screen { position: relative; flex: 1; min-height: 0; background: var(--t-bg); border-radius: 18px; padding: 14px 16px; display: flex; }
.screen pre { margin: 0; flex: 1; min-height: 0; overflow: auto; color: var(--t-fg); font: 13px/1.5 var(--f-mono); }
body:not([data-tstate="active"]) .screen pre { opacity: .55; filter: saturate(.6); }
.t-dim { color: var(--t-dim); } .t-acc { color: var(--t-acc); } .t-ok { color: var(--t-ok); } .t-warn { color: var(--t-warn); } .t-err { color: var(--t-err); } .t-blue { color: var(--t-blue); }
.t-del { color: var(--t-err); background: rgba(229,154,134,.12); } .t-ins { color: var(--t-ok); background: rgba(180,197,143,.12); }
.notice { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(520px, calc(100% - 28px)); background: var(--cream); color: var(--ink); border-radius: 18px; padding: 14px 18px; box-shadow: 0 20px 40px -18px rgba(0,0,0,.6); display: flex; gap: 12px; align-items: center; }
body[data-tstate="active"] .notice { display: none; }
.notice b { display: block; font-weight: 900; }
.notice span { color: var(--ink-2); font-size: 13px; }
.notice .btn { margin-left: auto; }

/* ===== 审计 ===== */
.audit { background: var(--cream); border-radius: 22px; box-shadow: var(--shadow), 0 0 0 1px var(--line); padding: 8px 10px; overflow-x: auto; }
.audit table { width: 100%; border-collapse: collapse; }
.audit th { text-align: left; font-size: 12px; color: var(--ink-3); font-weight: 800; padding: 8px 12px; }
.audit td { padding: 11px 12px; border-top: 1px solid var(--pad-2); white-space: nowrap; }
.audit .mono { font: 12px var(--f-mono); color: var(--ink-2); }
.ev { font-weight: 800; }
.ev-start { background: var(--sage-soft); color: var(--sage); }
.ev-end, .ev-exited { background: var(--pad-2); color: var(--ink-2); }
.ev-denied, .ev-disabled { background: var(--honey-soft); color: var(--honey-ink); }
.ev-reclaimed { background: var(--plum-soft); color: var(--plum); }
.ev-disconnected { background: var(--rose-soft); color: var(--rose); }
.audit-head { display: flex; align-items: center; gap: 12px; margin: 6px 6px 14px; }
.audit-head h2 { margin: 0; font-size: 20px; font-weight: 900; flex: 1; }
.audit-head p { margin: 0; color: var(--ink-3); font-size: 13px; }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0,1fr); }
  .rail { position: static; flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
  .rail h3 { display: none; }
  .mcard { min-width: 190px; }
}
@media (max-width: 640px) {
  .top { padding: 12px 16px; gap: 10px; flex-wrap: wrap; }
  .top .brand span:last-child { display: none; }
  .wrap { padding: 4px 16px 80px; }
  .attn { padding: 16px; border-radius: 22px; }
  .attn-item { grid-template-columns: 36px minmax(0,1fr); }
  .bell { width: 36px; height: 36px; border-radius: 12px; }
  .attn-item .btn { grid-column: 1 / -1; }
  .row { grid-template-columns: minmax(0,1fr) auto; }
  .r-mid { grid-column: 1 / -1; grid-row: 2; }
  .r-act { grid-column: 2; grid-row: 1; }
  .g-meta { margin-left: 0; width: 100%; }
  .term-page { padding: 10px 10px 58px; height: 100dvh; }
  .term-card { padding: 10px; border-radius: 20px; }
  .screen { padding: 10px; }
  .screen pre { font-size: 11px; }
  .switch { order: 5; width: 100%; }
  .audit { background: none; box-shadow: none; padding: 0; }
  .audit thead { display: none; }
  .audit table, .audit tbody, .audit tr, .audit td { display: block; }
  .audit tr { background: var(--cream); border-radius: 18px; box-shadow: 0 0 0 1px var(--line); padding: 10px 14px; margin-bottom: 8px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
  .audit td { border: 0; padding: 0; white-space: normal; }
  .audit td:nth-child(1) { grid-column: 2; text-align: right; }
  .audit td:nth-child(2) { grid-row: 1; grid-column: 1; }
  .audit td:nth-child(3), .audit td:nth-child(4) { grid-column: 1 / -1; font-weight: 700; }
  .audit td:nth-child(5) { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<nav class="proto" aria-label="原型页面">
  <button data-go="login">登录</button><button data-go="main">主界面</button><button data-go="term">接管终端</button><button data-go="audit">审计</button>
</nav>

<section class="view login" data-view="login">
  <form class="login-card" data-login>
    <div class="logo">T</div>
    <h1>Tether Hub</h1>
    <p>你所有机器上的 Tether 会话，都在这里。</p>
    <div class="field"><label for="pw">管理员密码</label><input id="pw" type="password" value="••••••••••" autocomplete="current-password"></div>
    <button class="btn" type="submit">登录</button>
    <div class="login-foot">忘记密码：在服务器上运行 pnpm admin reset</div>
  </form>
</section>

<section class="view" data-view="main">
  <header class="top">
    <div class="brand"><span class="logo">T</span><span>Tether Hub</span></div>
    <nav class="tabs"><button data-go="main">会话</button><button data-go="audit">审计</button></nav>
    <span class="grow"></span>
    <span class="live" title="实时连接正常（SSE）"><i></i>实时</span>
    <button class="btn ghost sm" data-go="login">退出登录</button>
  </header>
  <div class="wrap">
    <section class="attn" id="attn"></section>
    <div class="layout">
      <aside class="rail" id="rail"></aside>
      <div id="groups"></div>
    </div>
  </div>
</section>

<section class="view term-page" data-view="term">
  <div class="term-card">
    <div class="t-head">
      <span class="t-title">tether-hub<small>DEV-PC · #3 · C:\workspace\tether-hub</small></span>
      <span class="pill t-state" id="tstate">接管中</span>
      <span class="grow"></span>
      <div class="switch" aria-label="原型：切换状态">
        <button data-tstate="active">接管中</button><button data-tstate="reclaimed">本地收回</button><button data-tstate="disabled">未允许</button><button data-tstate="exited">已退出</button><button data-tstate="offline">离线</button>
      </div>
      <button class="btn ghost sm" data-go="main">关闭</button>
    </div>
    <div class="screen"><pre id="term"></pre>
      <div class="notice"><div><b id="nt"></b><span id="nn"></span></div><button class="btn sm" data-go="main">返回会话</button></div>
    </div>
  </div>
</section>

<section class="view" data-view="audit">
  <header class="top">
    <div class="brand"><span class="logo">T</span><span>Tether Hub</span></div>
    <nav class="tabs"><button data-go="main">会话</button><button data-go="audit">审计</button></nav>
    <span class="grow"></span>
    <span class="live"><i></i>实时</span>
    <button class="btn ghost sm" data-go="login">退出登录</button>
  </header>
  <div class="wrap">
    <div class="audit-head"><h2>接管审计</h2><p>最近 200 条</p><button class="btn ghost sm">刷新</button></div>
    <div class="audit"><table><thead><tr><th>时间</th><th>事件</th><th>机器</th><th>会话</th><th>来源 IP</th></tr></thead><tbody id="audit"></tbody></table></div>
  </div>
</section>

<script>
/* ===== 假数据与视图切换（各原型共用，构建时内联） ===== */
const STATUS = { running: '运行中', waiting: '等待中', exited: '已退出' };
const CLAUDE = { thinking: '思考中', waiting: '等待确认', background: '子代理运行中', done: '已完成' };
const EVENT = { start: '开始接管', end: '结束接管', denied: '接管被拒绝', reclaimed: '被本地收回', disabled: '本机关闭接管', exited: '会话退出', disconnected: '机器断线' };
const TSTATE = {
  active: { label: '接管中', note: '你的键盘输入会直接发送到这台机器。' },
  reclaimed: { label: '已被本地收回', note: '本机用户在 Tether 里收回了控制，此处不再接收输入。' },
  disabled: { label: '本机未允许接管', note: '在这台机器的 Tether 设置 › 管理服务器 中打开「允许远程接管」后重试。' },
  exited: { label: '会话已退出', note: '进程已结束，画面停在最后一帧。' },
  offline: { label: '机器离线', note: 'DEV-PC 与服务器的连接已断开，恢复后可重新接管。' },
};
const MACHINES = [
  { name: 'DEV-PC', version: '0.9.2', online: true, seen: '刚刚', token: 'dev-pc', sessions: [
    { id: 3, name: 'tether-hub', cwd: 'C:\\workspace\\tether-hub', cmd: 'claude', status: 'running', claude: 'waiting', started: '今天 09:12', last: '刚刚', ask: 'Bash(pnpm test) 请求执行，等待你选择是否允许' },
    { id: 5, name: 'tether', cwd: 'C:\\workspace\\tether', cmd: 'claude', status: 'running', claude: 'thinking', started: '今天 10:40', last: '12 秒前' },
    { id: 7, name: 'pwsh', cwd: 'C:\\Users\\dev', cmd: 'pwsh.exe', status: 'running', claude: null, started: '今天 08:55', last: '6 分钟前' },
  ] },
  { name: 'BUILD-BOX', version: '0.9.2', online: true, seen: '刚刚', token: 'build-box', sessions: [

const BOX = (() => {
  const W = 54, rows = ["<b>Bash command</b>", "  pnpm test", "  <span class=\"t-dim\">Re-run unit tests after the fix</span>", "",
    "Do you want to proceed?", "<span class=\"t-blue\">❯ 1. Yes</span>", "  2. Yes, and don't ask again for pnpm test", "  3. No, and tell Claude what to do differently"];
  const plain = h => h.replace(/<[^>]+>/g, "").length;
  const w = t => `<span class="t-warn">${t}</span>`;
  return [w("╭" + "─".repeat(W) + "╮"), ...rows.map(h => `${w("│")} ${h}${" ".repeat(W - 1 - plain(h))}${w("│")}`), w("╰" + "─".repeat(W) + "╯")].join("\n");
})();

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* 视图切换：[data-go] 切换 .view[data-view]；[data-tstate] 切换终端状态；支持 #main / #term:reclaimed 便于截图 */
function hubViews(onTerm) {
  const show = (v, t) => {
    document.querySelectorAll('.view').forEach(el => { el.hidden = el.dataset.view !== v; });
    document.querySelectorAll('[data-go]').forEach(b => b.setAttribute('aria-current', b.dataset.go === v ? 'page' : 'false'));
    document.body.dataset.view = v;
    if (v === 'term') setT(t || document.body.dataset.tstate || 'active');
  };
  const setT = t => {
    document.body.dataset.tstate = t;
    document.querySelectorAll('[data-tstate]').forEach(b => b.setAttribute('aria-pressed', b.dataset.tstate === t));
    onTerm && onTerm(t, TSTATE[t]);
  };
  document.addEventListener('click', e => {
    const go = e.target.closest('[data-go]'); if (go) { e.preventDefault(); show(go.dataset.go); history.replaceState(null, '', '#' + go.dataset.go); }
    const ts = e.target.closest('[data-tstate]'); if (ts) setT(ts.dataset.tstate);
  });
  document.querySelectorAll('form[data-login]').forEach(f => f.addEventListener('submit', e => { e.preventDefault(); show('main'); }));
  const [v, t] = (location.hash.slice(1) || 'main').split(':');
  show(['login', 'main', 'term', 'audit'].includes(v) ? v : 'main', t);
}

      </div>`).join('') : `<div class="empty">离线，暂无会话信息。机器重新连上后会自动出现在这里。</div>`}</div>
